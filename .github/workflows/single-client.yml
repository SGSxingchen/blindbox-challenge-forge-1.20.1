name: 真实单客户端启动

on:
  push:
  pull_request:
  # 若 GitHub 漏投递 push，可在同一 master SHA 手动真实执行，不能伪造门禁状态。
  workflow_dispatch:

jobs:
  single-client-main-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装 Xvfb、Mesa 与固定客户端启动库
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 libflite1
          python -m pip install 'minecraft-launcher-lib==8.0'
      - name: 构建正式模组与隔离测试探针
        run: |
          chmod +x gradlew scripts/ci/install-client.py scripts/ci/run-client-smoke.py scripts/ci/p5-client-suite.sh scripts/ci/run-p5-decor-clients.py
          ./gradlew --no-daemon build ciTestJar
      - name: 安装固定 Forge 客户端并部署本次产物
        run: |
          python scripts/ci/install-client.py build/ci-client
          mkdir -p build/ci-client/mods build/ci-client/config
          # 单客户端必须安装 JarJar 的发行候选，不能误取不含 JLayer 的普通 reobf jar。
          formal="$(find build/libs -maxdepth 1 -type f -name 'blindboxchallenge-*-all.jar' -print)"
          test -n "$formal" && test -f "$formal"
          cp "$formal" build/ci-client/mods/
          cp build/libs/blindboxchallenge-0.1.0-p1-citest.jar build/ci-client/mods/
          printf 'earlyWindowControl=false\n' > build/ci-client/config/fml.toml
      - name: Xvfb 启动真实 Forge 客户端并稳定进入主菜单
        run: python scripts/ci/run-client-smoke.py build/ci-client
      - name: 同一正式产物的一服一真实客户端 P5 装饰放置与回收
        run: scripts/ci/p5-client-suite.sh single
      - name: 上传客户端证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: single-client-evidence
          path: |
            mod/build/ci-client/ci-client-result.json
            mod/build/ci-client/ci-client-main-menu.marker
            mod/build/ci-client/logs/
            mod/build/ci-client/crash-reports/
            mod/build/ci-p5-single-evidence/
            mod/build/ci-p5-single-server/server.log
            mod/build/ci-p5-single-server/crash-reports/
            mod/build/ci-p5-single-client-1/logs/
            mod/build/ci-p5-single-client-1/crash-reports/
          if-no-files-found: warn
