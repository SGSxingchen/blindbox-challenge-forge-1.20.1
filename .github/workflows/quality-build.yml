name: 质量与构建

on:
  push:
  pull_request:
  # 若 GitHub 漏投递 push，可在同一 master SHA 手动真实执行，不能伪造门禁状态。
  workflow_dispatch:

jobs:
  quality-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: 允许执行 Gradle Wrapper
        run: chmod +x gradlew
      - name: 质量检查、正式构建与 CI 探针构建
        run: ./gradlew --no-daemon check build ciTestJar
      - name: 断言正式 Jar 不含 CI 探针
        run: |
          # ForgeGradle 6 的 jarJar 发行候选固定为 *-all.jar；普通 reobf jar 不含嵌入的 JLayer。
          # 不允许在多个候选中任意挑第一个，test -f 会在 0 个或多个匹配时严格失败。
          FORMAL_JAR="$(find build/libs -maxdepth 1 -type f -name 'blindboxchallenge-*-all.jar' -print)"
          fail() { echo "::error::正式 Jar 质量断言失败：$1"; exit 1; }
          test -n "$FORMAL_JAR" || fail '找不到正式 Jar'
          test -f "$FORMAL_JAR" || fail '正式 Jar 候选不唯一'
          if jar tf "$FORMAL_JAR" | grep -q '^cn/blindboxchallenge/citest/'; then fail '正式 Jar 混入 ciTest 类'; fi
          if jar tf "$FORMAL_JAR" | grep -q '^ci-audio/'; then fail '正式 Jar 混入 ciTest 音频'; fi
          jar tf "$FORMAL_JAR" | grep -q '^META-INF/jarjar/.*jlayer.*\.jar$' || fail '正式 Jar 未包含 JLayer Jar-in-Jar'
          jar tf "$FORMAL_JAR" | grep -q '^META-INF/licenses/JLayer-LGPL-2.1.txt$' || fail '正式 Jar 缺少 JLayer LGPL 文本'
          jar tf "$FORMAL_JAR" | grep -q '^META-INF/licenses/JLayer-NOTICE.txt$' || fail '正式 Jar 缺少 JLayer NOTICE'
          CITEST_JAR="build/libs/blindboxchallenge-0.1.0-p1-citest.jar"
          test -f "$CITEST_JAR" || fail '找不到独立 ciTest Jar'
          jar tf "$CITEST_JAR" | grep -q '^cn/blindboxchallenge/citest/CiTestProbe.class$' || fail 'ciTest Jar 缺少探针入口'
          jar tf "$CITEST_JAR" | grep -q '^META-INF/mods.toml$' || fail 'ciTest Jar 缺少 mods.toml'
          jar tf "$CITEST_JAR" | grep -q '^ci-audio/blindbox-ci-tone.ogg$' || fail 'ciTest Jar 缺少自制 OGG 夹具'
      - name: 校验网络包方向与一次性提交门闩
        run: |
          grep -A1 'CommitPackingPacket.class' src/main/java/cn/blindboxchallenge/network/ModNetwork.java | grep -q 'PLAY_TO_SERVER'
          grep -A1 'RequestDoubleJumpPacket.class' src/main/java/cn/blindboxchallenge/network/ModNetwork.java | grep -q 'PLAY_TO_SERVER'
          grep -A1 'SyncPlayerAbilityPacket.class' src/main/java/cn/blindboxchallenge/network/ModNetwork.java | grep -q 'PLAY_TO_CLIENT'
          grep -A1 'CommitLetterEditPacket.class' src/main/java/cn/blindboxchallenge/network/ModNetwork.java | grep -q 'PLAY_TO_SERVER'
          grep -A1 'CommitDeathNotePacket.class' src/main/java/cn/blindboxchallenge/network/ModNetwork.java | grep -q 'PLAY_TO_SERVER'
          grep -A1 'ShowLetterPacket.class' src/main/java/cn/blindboxchallenge/network/ModNetwork.java | grep -q 'PLAY_TO_CLIENT'
          grep -A1 'CommitMusicBoxUrlPacket.class' src/main/java/cn/blindboxchallenge/network/ModNetwork.java | grep -q 'PLAY_TO_SERVER'
          grep -A1 'PlayMusicBoxPacket.class' src/main/java/cn/blindboxchallenge/network/ModNetwork.java | grep -q 'PLAY_TO_CLIENT'
          grep -q 'authorizeAndConsume(player, packet)' src/main/java/cn/blindboxchallenge/network/CommitPackingPacket.java
          grep -q 'consumeSubmission()' src/main/java/cn/blindboxchallenge/menu/PackingMenu.java
          grep -q 'isMatchingTextItem(player, packet.heldSlot(), packet.instanceId(), packet.revision(), true)' src/main/java/cn/blindboxchallenge/network/CommitLetterEditPacket.java
          grep -q 'isMatchingTextItem(player, packet.heldSlot(), packet.instanceId(), packet.revision(), false)' src/main/java/cn/blindboxchallenge/network/CommitDeathNotePacket.java
          # 1.20.1 的 Player 只有无参 mayBuild()；方块位置权限必须再由 Level.mayInteract 校验。
          ! grep -RInE 'mayBuild\([^)]' src/main/java/cn/blindboxchallenge
          grep -q 'sourceLevel.mayInteract(player, sourcePos)' src/main/java/cn/blindboxchallenge/service/DoorService.java
          # ServerPlayer 跨维 teleportTo 不会自动清除进入门体前的速度；安全落点必须是服务端归零后的站立位置。
          grep -q 'player.setDeltaMovement(Vec3.ZERO);' src/main/java/cn/blindboxchallenge/service/DoorService.java
          grep -q 'player.hurtMarked = true;' src/main/java/cn/blindboxchallenge/service/DoorService.java
          grep -q 'level.mayInteract(player, clicked)' src/main/java/cn/blindboxchallenge/service/DoorService.java
          grep -q 'box.getLevel().mayInteract(player, box.getBlockPos())' src/main/java/cn/blindboxchallenge/service/MusicBoxService.java
          grep -q 'player.level().mayInteract(player, packet.position())' src/main/java/cn/blindboxchallenge/network/CommitMusicBoxUrlPacket.java
          # ciTest 是独立 mod，绝不能与生产 mod 共享同一个 Java 包，否则 Forge 模块层会拒绝启动。
          ! grep -RInE '^package cn\.blindboxchallenge\.client(\.|;)' src/ciTest/java
          grep -q '^public final class RemoteMusicSoundInstance' src/main/java/cn/blindboxchallenge/client/audio/RemoteMusicSoundInstance.java
          grep -q 'public UUID eventId()' src/main/java/cn/blindboxchallenge/client/audio/RemoteMusicSoundInstance.java
          grep -q 'public RemoteAudioDownload.Kind kind()' src/main/java/cn/blindboxchallenge/client/audio/RemoteMusicSoundInstance.java
          grep -q 'public boolean cacheHit()' src/main/java/cn/blindboxchallenge/client/audio/RemoteMusicSoundInstance.java
          grep -q 'public net.minecraft.core.BlockPos source()' src/main/java/cn/blindboxchallenge/client/audio/RemoteMusicSoundInstance.java
          ! grep -RInE 'net\.minecraft\.client|javazoom\.' src/main/java/cn/blindboxchallenge/{block,blockentity,item,service,network,registry,menu,event,data,config}
      - name: 生成 Jar 校验和
        run: |
          find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -print0 | sort -z | xargs -0 sha256sum > build/libs/SHA256SUMS
          cat build/libs/SHA256SUMS
      - name: 上传构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blindboxchallenge-jar
          path: |
            mod/build/libs/*.jar
            mod/build/libs/SHA256SUMS
          if-no-files-found: error
