name: 质量与构建

on:
  push:
  pull_request:
  # 若 GitHub 漏投递 push，可在同一 master SHA 手动真实执行，不能伪造门禁状态。
  workflow_dispatch:

jobs:
  quality-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: 允许执行 Gradle Wrapper
        run: chmod +x gradlew
      - name: 质量检查、正式构建与 CI 探针构建
        run: ./gradlew --no-daemon check build ciTestJar
      - name: 校验正式 Jar 与独立 ciTest Jar 隔离
        run: |
          fail() { echo "::error::Jar 隔离断言失败：$1"; exit 1; }
          pass() { echo "[通过] $1"; }
          mapfile -t FORMAL_JARS < <(find build/libs -maxdepth 1 -type f -name 'blindboxchallenge-*-all.jar' -print | sort)
          printf '[信息] 正式 Jar 候选（%s）：\n' "${#FORMAL_JARS[@]}"
          printf '  %s\n' "${FORMAL_JARS[@]:-<无>}"
          [ "${#FORMAL_JARS[@]}" -eq 1 ] || fail '正式 Jar 候选必须唯一'
          FORMAL_JAR="${FORMAL_JARS[0]}"
          mapfile -t CITEST_JARS < <(find build/libs -maxdepth 1 -type f -name 'blindboxchallenge-*-citest.jar' -print | sort)
          printf '[信息] ciTest Jar 候选（%s）：\n' "${#CITEST_JARS[@]}"
          printf '  %s\n' "${CITEST_JARS[@]:-<无>}"
          [ "${#CITEST_JARS[@]}" -eq 1 ] || fail 'ciTest Jar 候选必须唯一'
          CITEST_JAR="${CITEST_JARS[0]}"
          assert_absent() { if jar tf "$1" | grep -q "$2"; then fail "$3"; else pass "$3"; fi; }
          assert_present() { if jar tf "$1" | grep -q "$2"; then pass "$3"; else fail "$3"; fi; }
          assert_absent "$FORMAL_JAR" '^cn/blindboxchallenge/citest/' '正式 Jar 不含 ciTest 类'
          assert_absent "$FORMAL_JAR" '^ci-audio/' '正式 Jar 不含 ciTest 音频'
          assert_present "$FORMAL_JAR" '^META-INF/jarjar/.*jlayer.*\.jar$' '正式 Jar 包含 JLayer Jar-in-Jar'
          assert_present "$FORMAL_JAR" '^META-INF/licenses/JLayer-LGPL-2.1.txt$' '正式 Jar 包含 JLayer LGPL 文本'
          assert_present "$FORMAL_JAR" '^META-INF/licenses/JLayer-NOTICE.txt$' '正式 Jar 包含 JLayer NOTICE'
          assert_present "$CITEST_JAR" '^cn/blindboxchallenge/citest/CiTestProbe.class$' 'ciTest Jar 包含探针入口'
          assert_present "$CITEST_JAR" '^META-INF/mods.toml$' 'ciTest Jar 包含独立 mods 元数据'
          assert_present "$CITEST_JAR" '^ci-audio/blindbox-ci-tone.ogg$' 'ciTest Jar 包含短音频夹具'
          assert_present "$CITEST_JAR" '^ci-audio/blindbox-ci-cache-pressure.ogg$' 'ciTest Jar 包含缓存压力夹具'
      - name: 校验稳定资源、安全与双端隔离契约
        run: python3 ../tools/verify_quality_contract.py
      - name: 生成 Jar 校验和
        run: |
          find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -print0 | sort -z | xargs -0 sha256sum > build/libs/SHA256SUMS
          cat build/libs/SHA256SUMS
      - name: 上传构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blindboxchallenge-jar
          path: |
            mod/build/libs/*.jar
            mod/build/libs/SHA256SUMS
          if-no-files-found: error
