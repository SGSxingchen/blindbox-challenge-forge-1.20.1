name: 质量与构建

on:
  push:
  pull_request:
  # 若 GitHub 漏投递 push，可在同一 master SHA 手动真实执行，不能伪造门禁状态。
  workflow_dispatch:

jobs:
  quality-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: 允许执行 Gradle Wrapper
        run: chmod +x gradlew
      - name: 质量检查、正式构建与 CI 探针构建
        run: ./gradlew --no-daemon check build ciTestJar
      - name: 断言正式 Jar 不含 CI 探针
        run: |
          # ForgeGradle 6 的 jarJar 发行候选固定为 *-all.jar；普通 reobf jar 不含嵌入的 JLayer。
          # 不允许在多个候选中任意挑第一个，test -f 会在 0 个或多个匹配时严格失败。
          FORMAL_JAR="$(find build/libs -maxdepth 1 -type f -name 'blindboxchallenge-*-all.jar' -print)"
          fail() { echo "::error::正式 Jar 质量断言失败：$1"; exit 1; }
          test -n "$FORMAL_JAR" || fail '找不到正式 Jar'
          test -f "$FORMAL_JAR" || fail '正式 Jar 候选不唯一'
          if jar tf "$FORMAL_JAR" | grep -q '^cn/blindboxchallenge/citest/'; then fail '正式 Jar 混入 ciTest 类'; fi
          if jar tf "$FORMAL_JAR" | grep -q '^cn/blindboxchallenge/citest/CiClientP5DecorObservation.class$'; then fail '正式 Jar 混入 P5 客户端探针'; fi
          if jar tf "$FORMAL_JAR" | grep -q '^ci-audio/'; then fail '正式 Jar 混入 ciTest 音频'; fi
          jar tf "$FORMAL_JAR" | grep -q '^META-INF/jarjar/.*jlayer.*\.jar$' || fail '正式 Jar 未包含 JLayer Jar-in-Jar'
          jar tf "$FORMAL_JAR" | grep -q '^META-INF/licenses/JLayer-LGPL-2.1.txt$' || fail '正式 Jar 缺少 JLayer LGPL 文本'
          jar tf "$FORMAL_JAR" | grep -q '^META-INF/licenses/JLayer-NOTICE.txt$' || fail '正式 Jar 缺少 JLayer NOTICE'
          CITEST_JAR="build/libs/blindboxchallenge-0.1.0-p1-citest.jar"
          test -f "$CITEST_JAR" || fail '找不到独立 ciTest Jar'
          jar tf "$CITEST_JAR" | grep -q '^cn/blindboxchallenge/citest/CiTestProbe.class$' || fail 'ciTest Jar 缺少探针入口'
          jar tf "$CITEST_JAR" | grep -q '^META-INF/mods.toml$' || fail 'ciTest Jar 缺少 mods.toml'
          jar tf "$CITEST_JAR" | grep -q '^ci-audio/blindbox-ci-tone.ogg$' || fail 'ciTest Jar 缺少自制 OGG 夹具'
      - name: 校验网络包方向与一次性提交门闩
        run: |
          grep -A1 'CommitPackingPacket.class' src/main/java/cn/blindboxchallenge/network/ModNetwork.java | grep -q 'PLAY_TO_SERVER'
          grep -A1 'RequestDoubleJumpPacket.class' src/main/java/cn/blindboxchallenge/network/ModNetwork.java | grep -q 'PLAY_TO_SERVER'
          grep -A1 'SyncPlayerAbilityPacket.class' src/main/java/cn/blindboxchallenge/network/ModNetwork.java | grep -q 'PLAY_TO_CLIENT'
          grep -A1 'CommitLetterEditPacket.class' src/main/java/cn/blindboxchallenge/network/ModNetwork.java | grep -q 'PLAY_TO_SERVER'
          grep -A1 'CommitDeathNotePacket.class' src/main/java/cn/blindboxchallenge/network/ModNetwork.java | grep -q 'PLAY_TO_SERVER'
          grep -A1 'ShowLetterPacket.class' src/main/java/cn/blindboxchallenge/network/ModNetwork.java | grep -q 'PLAY_TO_CLIENT'
          grep -A1 'CommitMusicBoxUrlPacket.class' src/main/java/cn/blindboxchallenge/network/ModNetwork.java | grep -q 'PLAY_TO_SERVER'
          grep -A1 'PlayMusicBoxPacket.class' src/main/java/cn/blindboxchallenge/network/ModNetwork.java | grep -q 'PLAY_TO_CLIENT'
          grep -q 'authorizeAndConsume(player, packet)' src/main/java/cn/blindboxchallenge/network/CommitPackingPacket.java
          grep -q 'consumeSubmission()' src/main/java/cn/blindboxchallenge/menu/PackingMenu.java
          grep -q 'isMatchingTextItem(player, packet.heldSlot(), packet.instanceId(), packet.revision(), true)' src/main/java/cn/blindboxchallenge/network/CommitLetterEditPacket.java
          grep -q 'isMatchingTextItem(player, packet.heldSlot(), packet.instanceId(), packet.revision(), false)' src/main/java/cn/blindboxchallenge/network/CommitDeathNotePacket.java
          # 1.20.1 的 Player 只有无参 mayBuild()；方块位置权限必须再由 Level.mayInteract 校验。
          ! grep -RInE 'mayBuild\([^)]' src/main/java/cn/blindboxchallenge
          grep -q 'sourceLevel.mayInteract(player, sourcePos)' src/main/java/cn/blindboxchallenge/service/DoorService.java
          # 同维 teleportTo 不能代替跨维 changeDimension；安全门必须用无门户的精确 ITeleporter 并归零速度。
          grep -q 'player.changeDimension(targetLevel, new SafeDoorTeleporter(destination, yaw, pitch))' src/main/java/cn/blindboxchallenge/service/DoorService.java
          grep -q 'return repositionEntity.apply(false);' src/main/java/cn/blindboxchallenge/service/DoorService.java
          # 所有门传送都必须等原移动包退出后在 ServerTick.END 以真实 entityInside 入口和全量事实重验执行，目标门免疫须在 changeDimension 前预留。
          grep -q 'PENDING_TELEPORTS.putIfAbsent(player.getUUID(), sourceGlobal)' src/main/java/cn/blindboxchallenge/service/DoorService.java
          grep -q 'BlockPos sourceSnapshot = sourcePos.immutable();' src/main/java/cn/blindboxchallenge/service/DoorService.java
          grep -q 'GlobalPos.of(sourceLevel.dimension(), sourceSnapshot)' src/main/java/cn/blindboxchallenge/service/DoorService.java
          grep -q 'processPendingTeleports(event.getServer())' src/main/java/cn/blindboxchallenge/event/ServerLifecycleEvents.java
          grep -q 'PENDING 只能由本服务器 tick 的 Block#entityInside 写入' src/main/java/cn/blindboxchallenge/service/DoorService.java
          grep -q '!insideDoorCell(player, arrival.pos())' src/main/java/cn/blindboxchallenge/service/DoorService.java
          grep -q 'DoorService.processPendingTeleports(level.getServer())' src/ciTest/java/cn/blindboxchallenge/citest/DoorCiScenario.java
          grep -B16 'moveToVerifiedDestination(player, targetLevel, destination)' src/main/java/cn/blindboxchallenge/service/DoorService.java | grep -q 'ARRIVAL_DOOR_IMMUNITIES.put(playerId, targetDoorGlobal)'
          grep -q 'if (player.isChangingDimension()) return;' src/main/java/cn/blindboxchallenge/service/DoorService.java
          # P4 夹具定位也必须发完整跨维玩家同步，不能用裸 teleportTo 伪造门跨维成功。
          grep -q 'player.changeDimension(destinationLevel, new FixtureTeleporter(destination, yaw, pitch))' src/ciTest/java/cn/blindboxchallenge/citest/P4DoorRecoveryCiScenario.java
          grep -q 'if (alice.isChangingDimension()) return;' src/ciTest/java/cn/blindboxchallenge/citest/P4DoorRecoveryCiScenario.java
          grep -q 'P4 跨维门抵达下界后回到源维度' src/ciTest/java/cn/blindboxchallenge/citest/P4DoorRecoveryCiScenario.java
          grep -q 'SOURCE_START_DISTANCE = 1.5D' src/ciTest/java/cn/blindboxchallenge/citest/P4DoorRecoveryCiScenario.java
          grep -q 'enteredFixtureDoorDeeply(self, source)' src/ciTest/java/cn/blindboxchallenge/citest/CiClientP4DoorRecoveryObservation.java
          grep -q 'FIXTURE_SETTLE_TICKS = 40' src/ciTest/java/cn/blindboxchallenge/citest/CiClientP4DoorRecoveryObservation.java
          grep -q 'P4_DOOR_RECOVERY_FIXTURE_SETTLED=success' src/ciTest/java/cn/blindboxchallenge/citest/P4DoorRecoveryCiScenario.java
          grep -q 'WALKING_TIMEOUT_TICKS = 400' src/ciTest/java/cn/blindboxchallenge/citest/CiClientP4DoorRecoveryObservation.java
          grep -q 'P4_DOOR_RECOVERY_SOURCE_MOVED=observed' src/ciTest/java/cn/blindboxchallenge/citest/P4DoorRecoveryCiScenario.java
          grep -q 'source_present={}, source_linked={}, ' src/ciTest/java/cn/blindboxchallenge/citest/P4DoorRecoveryCiScenario.java
          grep -q 'overworld.mayInteract(alice, sourceDoor)' src/ciTest/java/cn/blindboxchallenge/citest/P4DoorRecoveryCiScenario.java
          grep -q '真实前进键未进入 P4 跨维门：client=' src/ciTest/java/cn/blindboxchallenge/citest/CiClientP4DoorRecoveryObservation.java
          # 文本负例临时持有信件时，客户端不得提前驱动正向 GUI 或写结果；阶段旗标只能在 STARTED 后出现。
          grep -q 'if (!scenarioEnabled()) return;' src/ciTest/java/cn/blindboxchallenge/citest/CiClientP4TextObservation.java
          grep -q 'p4-text-enabled.flag' src/ciTest/java/cn/blindboxchallenge/citest/CiClientP4TextObservation.java
          grep -q -- '-Dblindbox.ci.p4TextStageDir=' scripts/ci/run-multi-client.py
          grep -q 'BLINDBOX_CITEST_P4_TEXT_STARTED=success' scripts/ci/multi-client.sh
          grep -A8 'BLINDBOX_CITEST_P4_TEXT_STARTED=success' scripts/ci/multi-client.sh | grep -q 'touch "${EVIDENCE}/p4-text-enabled.flag"'
          grep -q 'rm -f "${EVIDENCE}/p4-text-enabled.flag"' scripts/ci/multi-client.sh
          # 800 tick 是强制上限；跨维成功事实必须先消费，但换维/落地/速度等待不能借 return 绕过超时。
          grep -q 'phase != Phase.WAIT_FOR_CROSSING && timedOut' src/ciTest/java/cn/blindboxchallenge/citest/P4DoorRecoveryCiScenario.java
          grep -q 'if (phase != Phase.READY && timedOut) throw timeout(alice, bob());' src/ciTest/java/cn/blindboxchallenge/citest/P4DoorRecoveryCiScenario.java
          grep -q 'alice_on_ground=' src/ciTest/java/cn/blindboxchallenge/citest/P4DoorRecoveryCiScenario.java
          grep -q 'alice_velocity=' src/ciTest/java/cn/blindboxchallenge/citest/P4DoorRecoveryCiScenario.java
          grep -q 'horizontalSpeedSqr <= 1.0E-8D' src/ciTest/java/cn/blindboxchallenge/citest/P4DoorRecoveryCiScenario.java
          grep -q 'velocity.y >= -0.0800001D && velocity.y <= 1.0E-8D' src/ciTest/java/cn/blindboxchallenge/citest/P4DoorRecoveryCiScenario.java
          # 八音盒定位文件只记录真实输入/S2C/失败事件；PCM 成功仍只能由 SoundEngine read marker 证明。
          grep -q 'use-attempt.marker' src/ciTest/java/cn/blindboxchallenge/citest/client/audio/CiClientMusicBoxObservation.java
          grep -q '"received-" + event.eventId()' src/ciTest/java/cn/blindboxchallenge/citest/client/audio/CiClientMusicBoxObservation.java
          grep -q '"diagnostic-failed-" + event.eventId()' src/ciTest/java/cn/blindboxchallenge/citest/client/audio/CiClientMusicBoxObservation.java
          grep -q 'ogg-editor-reopened.marker' src/ciTest/java/cn/blindboxchallenge/citest/client/audio/CiClientMusicBoxObservation.java
          grep -q 'CONFIGURATION_INPUT_STALL_TICKS = 100' src/ciTest/java/cn/blindboxchallenge/citest/client/audio/CiClientMusicBoxObservation.java
          grep -q 'configuration-open-attempt.marker' src/ciTest/java/cn/blindboxchallenge/citest/client/audio/CiClientMusicBoxObservation.java
          grep -q 'configuration-input-stalled.marker' src/ciTest/java/cn/blindboxchallenge/citest/client/audio/CiClientMusicBoxObservation.java
          grep -q 'if (!observesMusicBox(minecraft)) return;' src/ciTest/java/cn/blindboxchallenge/citest/client/audio/CiClientMusicBoxObservation.java
          grep -q 'ModBlocks.MUSIC_BOX.get()' src/ciTest/java/cn/blindboxchallenge/citest/client/audio/CiClientMusicBoxObservation.java
          # 已有 URL 的重配必须沿生产 EditBox 的真实 End/Backspace/charTyped 路径清空，不能把修饰
          # 参数伪作物理 Ctrl 状态，避免把 MP3 URL 插进旧 OGG URL 后仍误以为已提交。
          grep -q 'clearExistingUrl(screen);' src/ciTest/java/cn/blindboxchallenge/citest/client/audio/CiClientMusicBoxObservation.java
          grep -q 'screen.keyPressed(InputConstants.KEY_END, 0, 0);' src/ciTest/java/cn/blindboxchallenge/citest/client/audio/CiClientMusicBoxObservation.java
          grep -q 'screen.keyPressed(InputConstants.KEY_BACKSPACE, 0, 0);' src/ciTest/java/cn/blindboxchallenge/citest/client/audio/CiClientMusicBoxObservation.java
          grep -q 'AudioUrlPolicy.MAX_URL_LENGTH' src/ciTest/java/cn/blindboxchallenge/citest/client/audio/CiClientMusicBoxObservation.java
          ! grep -q 'InputConstants.KEY_A, 0, InputConstants.MOD_CONTROL' src/ciTest/java/cn/blindboxchallenge/citest/client/audio/CiClientMusicBoxObservation.java
          # 文本场景须由 Bob 真实死亡并观察死亡屏，之后不复活；小黄鸡完整双端观察必须在此之前。
          grep -q 'ModItems.CLOCKWORK_CHICKEN.get().use(level, alice, InteractionHand.MAIN_HAND)' src/ciTest/java/cn/blindboxchallenge/citest/ClockworkChickenCiScenario.java
          grep -q 'preparePlatform(safe);' src/ciTest/java/cn/blindboxchallenge/citest/ClockworkChickenCiScenario.java
          grep -q 'safe.getY() + 1.0D' src/ciTest/java/cn/blindboxchallenge/citest/ClockworkChickenCiScenario.java
          grep -q 'private void preparePlatform(BlockPos platform)' src/ciTest/java/cn/blindboxchallenge/citest/ClockworkChickenCiScenario.java
          # 小黄鸡夹具的三组同维定位都必须清掉上一场景的速度和坠落累计；否则安全平台也会在下一 tick
          # 结算旧坠落。该闩只约束 ciTest 定位，不修改死亡、爆炸或正式玩法。
          grep -q 'private void moveFixturePlayer(ServerPlayer player, Vec3 destination, float yaw, float pitch)' src/ciTest/java/cn/blindboxchallenge/citest/ClockworkChickenCiScenario.java
          grep -q 'player.setDeltaMovement(Vec3.ZERO);' src/ciTest/java/cn/blindboxchallenge/citest/ClockworkChickenCiScenario.java
          grep -q 'player.hurtMarked = true;' src/ciTest/java/cn/blindboxchallenge/citest/ClockworkChickenCiScenario.java
          grep -q 'player.resetFallDistance();' src/ciTest/java/cn/blindboxchallenge/citest/ClockworkChickenCiScenario.java
          # 安全平台还必须清出真实身体和头顶空间；强杀后保存的高空原坐标不能在 cleanup 时再次
          # 交给下一场景，必须只读搜索已有可站立地面，找不到严格失败而非放置永久垫块。
          grep -q 'rememberAndSet(support.above(), Blocks.AIR.defaultBlockState());' src/ciTest/java/cn/blindboxchallenge/citest/ClockworkChickenCiScenario.java
          grep -q 'rememberAndSet(support.above(2), Blocks.AIR.defaultBlockState());' src/ciTest/java/cn/blindboxchallenge/citest/ClockworkChickenCiScenario.java
          grep -q 'safeHandoffDestination(alice, aliceOriginalPosition)' src/ciTest/java/cn/blindboxchallenge/citest/ClockworkChickenCiScenario.java
          grep -q 'safeHandoffDestination(bob, bobOriginalPosition)' src/ciTest/java/cn/blindboxchallenge/citest/ClockworkChickenCiScenario.java
          grep -q 'P4TextCiScenario.preparedHandoffDestination' src/ciTest/java/cn/blindboxchallenge/citest/ClockworkChickenCiScenario.java
          grep -q 'BLINDBOX_CITEST_P4_TEXT_HANDOFF_PREPARED=success' src/ciTest/java/cn/blindboxchallenge/citest/P4TextCiScenario.java
          grep -q 'BLINDBOX_CITEST_P4_TEXT_HANDOFF_RELEASED=success' src/ciTest/java/cn/blindboxchallenge/citest/P4TextCiScenario.java
          grep -q 'private static final class HandoffFixture' src/ciTest/java/cn/blindboxchallenge/citest/P4TextCiScenario.java
          grep -q 'before.forEach((position, state) -> level.setBlock(position, state, 3));' src/ciTest/java/cn/blindboxchallenge/citest/P4TextCiScenario.java
          grep -q 'Heightmap.Types.MOTION_BLOCKING_NO_LEAVES' src/ciTest/java/cn/blindboxchallenge/citest/ClockworkChickenCiScenario.java
          grep -q 'supportState.getFluidState().isEmpty()' src/ciTest/java/cn/blindboxchallenge/citest/ClockworkChickenCiScenario.java
          grep -q 'supportState.isFaceSturdy(level, support, Direction.UP)' src/ciTest/java/cn/blindboxchallenge/citest/ClockworkChickenCiScenario.java
          python3 - <<'PY'
          from pathlib import Path
          source = Path('src/ciTest/java/cn/blindboxchallenge/citest/ClockworkChickenCiScenario.java').read_text(encoding='utf-8')
          if source.count('moveFixturePlayer(') != 7:
              raise SystemExit('P4 小黄鸡三组夹具定位未全部走统一状态清理方法')
          if 'alice.teleportTo(level' in source or 'bob.teleportTo(level' in source:
              raise SystemExit('P4 小黄鸡仍存在绕过状态清理的玩家定位')
          handoff = source[source.index('private Vec3 safeHandoffDestination'):source.index('private void fail(Exception exception)')]
          if ('Blocks.' in handoff or 'setBlock(' in handoff or 'getHeight(Heightmap.Types.MOTION_BLOCKING_NO_LEAVES' not in handoff
                  or 'supportState.getFluidState().isEmpty()' not in handoff):
              raise SystemExit('P4 小黄鸡交接不得放置垫块，且必须只接受非流体的已有安全地面')
          PY
          python3 - <<'PY'
          from pathlib import Path
          source = Path('scripts/ci/multi-client.sh').read_text(encoding='utf-8')
          chicken_start = source.index("printf 'blindboxcitest start_p4_chicken\\n' >&3")
          chicken_cleanup = source.index("printf 'blindboxcitest cleanup_p4_chicken\\n' >&3")
          text_negative = source.index("printf 'blindboxcitest run_p4_text_negative\\n' >&3")
          text_start = source.index("printf 'blindboxcitest start_p4_text_clients\\n' >&3")
          assert chicken_start < chicken_cleanup < text_negative < text_start
          assert source.count("printf 'blindboxcitest start_p4_chicken\\n' >&3") == 1
          PY
          grep -q 'configuration_open_attempts=' src/ciTest/java/cn/blindboxchallenge/citest/P4MusicCiScenario.java
          grep -q 'configuration_input_stalls=' src/ciTest/java/cn/blindboxchallenge/citest/P4MusicCiScenario.java
          grep -q 'RELEASE_SHIFT_TICKS = 4' src/ciTest/java/cn/blindboxchallenge/citest/client/audio/CiClientMusicBoxObservation.java
          grep -q 'client_diagnostics=' src/ciTest/java/cn/blindboxchallenge/citest/P4MusicCiScenario.java
          grep -q '在线音频下载或解码失败（仅客户端）' src/main/java/cn/blindboxchallenge/client/audio/ClientMusicService.java
          grep -q 'failureSummary(exception)' src/main/java/cn/blindboxchallenge/client/audio/ClientMusicService.java
          ! grep -q 'getMessage()' src/main/java/cn/blindboxchallenge/client/audio/ClientMusicService.java
          grep -q 'TLS_SOCKET_WRAP, TLS_PARAMETERS, TLS_DEADLINE_ARM, TLS_HANDSHAKE, TLS_POST_HANDSHAKE_DEADLINE' src/main/java/cn/blindboxchallenge/client/audio/RemoteAudioDownload.java
          grep -q 'throw new AudioFailureException(FailureStage.DNS, exception);' src/main/java/cn/blindboxchallenge/client/audio/RemoteAudioDownload.java
          grep -q 'private static FailureStage connectStage(InetAddress address)' src/main/java/cn/blindboxchallenge/client/audio/RemoteAudioDownload.java
          # 固定连接不得把 IPv4 字面量交给默认双栈 socket；仍须保留 IPv6 回退、同一已校验地址和无代理边界。
          grep -q 'Arrays.stream(addresses).sorted(Comparator.comparingInt(RemoteAudioDownload::addressFamilyRank))' src/main/java/cn/blindboxchallenge/client/audio/RemoteAudioDownload.java
          grep -q 'private static Socket directSocketFor(InetAddress address)' src/main/java/cn/blindboxchallenge/client/audio/RemoteAudioDownload.java
          grep -q 'SocketChannel.open(address instanceof Inet4Address ? StandardProtocolFamily.INET : StandardProtocolFamily.INET6).socket()' src/main/java/cn/blindboxchallenge/client/audio/RemoteAudioDownload.java
          ! grep -q 'Proxy.NO_PROXY' src/main/java/cn/blindboxchallenge/client/audio/RemoteAudioDownload.java
          # 最终失败阶段可能是 IPv6，仍须输出每个地址族的无敏感异常类型，避免把末次地址族误作唯一尝试。
          grep -q 'Map<FailureStage, String> attempts = new LinkedHashMap<>()' src/main/java/cn/blindboxchallenge/client/audio/RemoteAudioDownload.java
          grep -q 'attempts.put(attemptStage, rootExceptionType(exception));' src/main/java/cn/blindboxchallenge/client/audio/RemoteAudioDownload.java
          grep -q 'String connectionAttemptSummary()' src/main/java/cn/blindboxchallenge/client/audio/RemoteAudioDownload.java
          grep -q 'staged.connectionAttemptSummary()' src/main/java/cn/blindboxchallenge/client/audio/ClientMusicService.java
          grep -q 'throw new AudioFailureException(stage, exception);' src/main/java/cn/blindboxchallenge/client/audio/RemoteAudioDownload.java
          grep -q 'stage = FailureStage.TLS_SOCKET_WRAP;' src/main/java/cn/blindboxchallenge/client/audio/RemoteAudioDownload.java
          grep -q 'stage = FailureStage.TLS_PARAMETERS;' src/main/java/cn/blindboxchallenge/client/audio/RemoteAudioDownload.java
          grep -q 'stage = FailureStage.TLS_DEADLINE_ARM;' src/main/java/cn/blindboxchallenge/client/audio/RemoteAudioDownload.java
          grep -q 'stage = FailureStage.TLS_POST_HANDSHAKE_DEADLINE;' src/main/java/cn/blindboxchallenge/client/audio/RemoteAudioDownload.java
          # 主机名校验必须由当前 SSLSocket 的 JSSE HTTPS endpoint identification 在握手中强制执行，
          # 不可调用可被全局替换的 HttpsURLConnection 默认 HostnameVerifier 作重复复验。
          grep -q 'parameters.setEndpointIdentificationAlgorithm("HTTPS");' src/main/java/cn/blindboxchallenge/client/audio/RemoteAudioDownload.java
          grep -q 'parameters.setServerNames(java.util.List.of(new SNIHostName(uri.getHost())));' src/main/java/cn/blindboxchallenge/client/audio/RemoteAudioDownload.java
          grep -q 'tls.setSSLParameters(parameters);' src/main/java/cn/blindboxchallenge/client/audio/RemoteAudioDownload.java
          grep -q 'TLS_FACTORY.createSocket(plain, uri.getHost(), 443, true)' src/main/java/cn/blindboxchallenge/client/audio/RemoteAudioDownload.java
          grep -q 'tls.startHandshake();' src/main/java/cn/blindboxchallenge/client/audio/RemoteAudioDownload.java
          ! grep -q 'getDefaultHostnameVerifier' src/main/java/cn/blindboxchallenge/client/audio/RemoteAudioDownload.java
          python3 - <<'PY'
          from pathlib import Path
          source = Path('src/main/java/cn/blindboxchallenge/client/audio/RemoteAudioDownload.java').read_text(encoding='utf-8')
          endpoint = source.index('parameters.setEndpointIdentificationAlgorithm("HTTPS");')
          sni = source.index('parameters.setServerNames(java.util.List.of(new SNIHostName(uri.getHost())));')
          apply = source.index('tls.setSSLParameters(parameters);')
          handshake = source.index('tls.startHandshake();')
          assert endpoint < sni < apply < handshake
          assert 'getDefaultHostnameVerifier' not in source
          PY
          grep -q 'throw new AudioFailureException(FailureStage.BODY, exception);' src/main/java/cn/blindboxchallenge/client/audio/RemoteAudioDownload.java
          grep -q 'FailureStage.DECODE' src/main/java/cn/blindboxchallenge/client/audio/RemoteMusicSoundInstance.java
          grep -q 'connectionAttempts.isEmpty() ? "" : "/attempts=" + connectionAttempts' src/main/java/cn/blindboxchallenge/client/audio/ClientMusicService.java
          # Hosted 直连预检只留脱敏网络事实，明确禁用代理，且不能替代生产客户端实际 PCM 断言。
          grep -q -- "curl --noproxy '\*' --ipv4 --http1.1" scripts/ci/multi-client.sh
          grep -q 'p4-audio-direct-preflight.txt' scripts/ci/multi-client.sh
          grep -q 'P4_AUDIO_DIRECT_EXIT' scripts/ci/multi-client.sh
          ! grep -q -- '--proxy\|--proxy-user\|-x ' scripts/ci/multi-client.sh
          # HTTP/1.1 已声明 Content-Length 时必须按长度收体，不能依赖保活连接 EOF；chunked+长度歧义一律拒绝。
          grep -q '在线音频响应同时声明 Content-Length 与 chunked' src/main/java/cn/blindboxchallenge/client/audio/RemoteAudioDownload.java
          grep -q 'return saveResponse(response.body(), cache, urlHash, deadlineNanos, declaredContentLength);' src/main/java/cn/blindboxchallenge/client/audio/RemoteAudioDownload.java
          grep -q 'if (remainingContentLength == 0L) break;' src/main/java/cn/blindboxchallenge/client/audio/RemoteAudioDownload.java
          grep -q '在线音频在 Content-Length 前意外结束' src/main/java/cn/blindboxchallenge/client/audio/RemoteAudioDownload.java
          python3 - <<'PY'
          from pathlib import Path
          source = Path('src/ciTest/java/cn/blindboxchallenge/citest/P4DoorRecoveryCiScenario.java').read_text(encoding='utf-8')
          start = source.index('if (alice.serverLevel().dimension().equals(nether.dimension())) {')
          end = source.index('} else if (reachedTargetDimension)', start)
          crossing = source[start:end]
          if 'return;' in crossing:
              raise SystemExit('P4 跨维成功态检查不得用 return 绕过 800 tick 超时')
          if ('if (!alice.isChangingDimension()) {' not in crossing
                  or 'if (alice.onGround() && horizontalSpeedSqr <= 1.0E-8D' not in crossing
                  or 'velocity.y >= -0.0800001D && velocity.y <= 1.0E-8D' not in crossing):
              raise SystemExit('P4 跨维成功态必须继续严格检查换维、落地与受限安全速度')
          PY
          # 生命周期夹具任一前置等待失败也必须保留原始服务器日志；该钩子只保存证据，不能吞失败。
          bash -n scripts/ci/lifecycle-recovery.sh
          grep -q 'trap on_exit EXIT' scripts/ci/lifecycle-recovery.sh
          grep -q 'canonical-state-at-exit.json' scripts/ci/lifecycle-recovery.sh
          # 小黄鸡恢复夹具必须避开随机地形；保留三格空气前置，不能以清地形掩盖夹具错误。
          grep -q 'CanonicalStateExporter.p4ChickenFixturePosition(level)' src/ciTest/java/cn/blindboxchallenge/citest/CiTestCommands.java
          grep -q 'level.getMaxBuildHeight() - 8' src/ciTest/java/cn/blindboxchallenge/citest/CanonicalStateExporter.java
          grep -q 'new AABB(p4ChickenFixturePosition(level)).inflate(2.0D)' src/ciTest/java/cn/blindboxchallenge/citest/CanonicalStateExporter.java
          grep -q 'level.getBlockState(position).isAir()' src/ciTest/java/cn/blindboxchallenge/citest/CiTestCommands.java
          grep -q 'level.getBlockState(position.above()).isAir()' src/ciTest/java/cn/blindboxchallenge/citest/CiTestCommands.java
          grep -q 'level.getBlockState(support).isAir()' src/ciTest/java/cn/blindboxchallenge/citest/CiTestCommands.java
          grep -q 'player.setDeltaMovement(Vec3.ZERO);' src/main/java/cn/blindboxchallenge/service/DoorService.java
          grep -q 'player.hurtMarked = true;' src/main/java/cn/blindboxchallenge/service/DoorService.java
          grep -q 'level.mayInteract(player, clicked)' src/main/java/cn/blindboxchallenge/service/DoorService.java
          grep -q 'box.getLevel().mayInteract(player, box.getBlockPos())' src/main/java/cn/blindboxchallenge/service/MusicBoxService.java
          grep -q 'player.level().mayInteract(player, packet.position())' src/main/java/cn/blindboxchallenge/network/CommitMusicBoxUrlPacket.java
          # ciTest 是独立 mod，绝不能与生产 mod 共享同一个 Java 包，否则 Forge 模块层会拒绝启动。
          ! grep -RInE '^package cn\.blindboxchallenge\.client(\.|;)' src/ciTest/java
          grep -q '^public final class RemoteMusicSoundInstance' src/main/java/cn/blindboxchallenge/client/audio/RemoteMusicSoundInstance.java
          grep -q 'public UUID eventId()' src/main/java/cn/blindboxchallenge/client/audio/RemoteMusicSoundInstance.java
          grep -q 'public RemoteAudioDownload.Kind kind()' src/main/java/cn/blindboxchallenge/client/audio/RemoteMusicSoundInstance.java
          grep -q 'public boolean cacheHit()' src/main/java/cn/blindboxchallenge/client/audio/RemoteMusicSoundInstance.java
          grep -q 'public net.minecraft.core.BlockPos source()' src/main/java/cn/blindboxchallenge/client/audio/RemoteMusicSoundInstance.java
          ! grep -RInE 'net\.minecraft\.client|javazoom\.' src/main/java/cn/blindboxchallenge/{block,blockentity,item,service,network,registry,menu,event,data,config}
      - name: 校验 P5 装饰方块资源闭合与真实客户端探针门闩
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import re
          import struct
          from pathlib import Path

          root = Path('.').resolve()
          asset_root = root / 'src/main/resources/assets/blindboxchallenge'
          data_root = root / 'src/main/resources/data/blindboxchallenge'
          ids = ('abstract_white_figurine', 'floor_art_panel', 'neutral_trophy')
          expected_boxes = {
              'abstract_white_figurine': {(4, 0, 4, 12, 9, 12), (5, 9, 5, 11, 14, 11)},
              'floor_art_panel': {(0, 0, 0, 16, 2, 16)},
              'neutral_trophy': {(4, 0, 4, 12, 3, 12), (7, 3, 7, 9, 7, 9), (5, 7, 5, 11, 12, 11)},
          }
          block_source = (root / 'src/main/java/cn/blindboxchallenge/registry/ModBlocks.java').read_text(encoding='utf-8')
          item_source = (root / 'src/main/java/cn/blindboxchallenge/registry/ModItems.java').read_text(encoding='utf-8')
          for identifier in ids:
              assert f'BLOCKS.register("{identifier}"' in block_source, identifier
              assert f'ITEMS.register("{identifier}"' in item_source, identifier
              assert f'ModBlocks.{identifier.upper()}.get()' in item_source, identifier
              state = json.loads((asset_root / 'blockstates' / f'{identifier}.json').read_text(encoding='utf-8'))
              assert state['variants']['']['model'] == f'blindboxchallenge:block/{identifier}'
              item_model = json.loads((asset_root / 'models/item' / f'{identifier}.json').read_text(encoding='utf-8'))
              assert item_model['parent'] == f'blindboxchallenge:block/{identifier}'
              model = json.loads((asset_root / 'models/block' / f'{identifier}.json').read_text(encoding='utf-8'))
              actual_boxes = {tuple(element['from'] + element['to']) for element in model['elements']}
              assert actual_boxes == expected_boxes[identifier], (identifier, actual_boxes)
              for box in expected_boxes[identifier]:
                  values = ', '.join(f'{value}.0D' for value in box)
                  assert f'Block.box({values})' in block_source, (identifier, box)
              assert (data_root / 'loot_tables/blocks' / f'{identifier}.json').is_file()
              png = (asset_root / 'textures/block' / f'{identifier}.png').read_bytes()
              assert png[:8] == b'\x89PNG\r\n\x1a\n', identifier
              chunks, offset = [], 8
              while offset < len(png):
                  length = struct.unpack('>I', png[offset:offset + 4])[0]
                  kind = png[offset + 4:offset + 8]
                  payload = png[offset + 8:offset + 8 + length]
                  chunks.append((kind, payload))
                  offset += 12 + length
              assert offset == len(png) and chunks[0][0] == b'IHDR' and chunks[-1][0] == b'IEND', identifier
              assert all(kind in {b'IHDR', b'IDAT', b'IEND'} for kind, _ in chunks), identifier
              width, height, bit_depth, color_type, compression, filter_method, interlace = struct.unpack('>IIBBBBB', chunks[0][1])
              assert (width, height, bit_depth, color_type, compression, filter_method, interlace) == (16, 16, 8, 6, 0, 0, 0), identifier
          for language in ('en_us', 'zh_cn'):
              values = json.loads((asset_root / 'lang' / f'{language}.json').read_text(encoding='utf-8'))
              for identifier in ids:
                  assert values[f'block.blindboxchallenge.{identifier}']
                  assert values[f'item.blindboxchallenge.{identifier}']
          forbidden = {'.jpg', '.jpeg', '.webp', '.psd', '.zip', '.mp3', '.ogg', '.wav'}
          assert not [path for path in asset_root.rglob('*') if path.is_file() and path.suffix.lower() in forbidden]
          manifest = (root.parent / 'docs/ASSET_MANIFEST.md').read_text(encoding='utf-8')
          rows = re.findall(r'\|`(mod/src/main/resources/[^`]+)`\|`([0-9a-f]{64})`\|', manifest)
          recorded = dict(rows)
          actual_resources = {path.relative_to(root.parent).as_posix(): path for path in (root / 'src/main/resources').rglob('*') if path.is_file()}
          assert len(rows) == len(recorded) == len(actual_resources), (len(rows), len(recorded), len(actual_resources))
          assert set(recorded) == set(actual_resources), (set(recorded) ^ set(actual_resources))
          for path, resource in actual_resources.items():
              assert recorded[path] == hashlib.sha256(resource.read_bytes()).hexdigest(), path
          for identifier in ids:
              assert f'`mod/src/main/resources/assets/blindboxchallenge/textures/block/{identifier}.png`' in manifest
          assert '待权利人/法务确认；Release 阻塞' in manifest

          scenario = (root / 'src/ciTest/java/cn/blindboxchallenge/citest/P5DecorCiScenario.java').read_text(encoding='utf-8')
          client = (root / 'src/ciTest/java/cn/blindboxchallenge/citest/CiClientP5DecorObservation.java').read_text(encoding='utf-8')
          commands = (root / 'src/ciTest/java/cn/blindboxchallenge/citest/CiTestCommands.java').read_text(encoding='utf-8')
          runner = (root / 'scripts/ci/run-multi-client.py').read_text(encoding='utf-8')
          script = (root / 'scripts/ci/multi-client.sh').read_text(encoding='utf-8')
          single_runner = (root / 'scripts/ci/run-p5-single-decor.py').read_text(encoding='utf-8')
          single_script = (root / 'scripts/ci/p5-single-decor.sh').read_text(encoding='utf-8')
          single_workflow = (root.parent / '.github/workflows/single-client.yml').read_text(encoding='utf-8')
          assert 'WAIT_FOR_INITIAL_PICKUP' in scenario and 'WAIT_FOR_RECOVERY_PICKUP' in scenario
          assert 'target.getZ() + 3.75D' in scenario
          assert 'client_diagnostics=' in scenario and 'client-1-p5-decor-diagnostic.marker' in scenario
          assert 'new ClientboundSetCarriedItemPacket(found)' in scenario
          assert 'new ClientboundSetCarriedItemPacket(selected)' in scenario
          assert 'new ItemEntity' in scenario and 'initial.setPickUpDelay(0);' in scenario
          assert 'countInventory(actor, round.item().get()) != 1' in scenario
          assert 'level.setBlock(support, Blocks.STONE.defaultBlockState(), 3);' in scenario
          for forbidden_call in ('setBlock(target', '.removeBlock(', '.destroyBlock(', '.useOn(', 'Block.dropResources', 'setItemInHand('):
              assert forbidden_call not in scenario, forbidden_call
          assert 'ensureMarkersAbsent' in scenario and 'client-1-p5-decor-observed.marker' in scenario
          assert 'ItemEntity.class' in scenario and 'entity.getItem().getCount() == 1' in scenario
          assert 'KeyMapping.click(minecraft.options.keyUse.getKey())' in client
          assert 'minecraft.options.keyAttack.setDown(true)' in client
          # 低矮画板（2/16 格）不能瞄准完整方块中心，否则射线会越过其选择轮廓命中后方地面；
          # 必须保持命中三种方块共同拥有的低位底座，攻击仍只走原版 keyAttack 路径。
          assert 'new Vec3(target.getX() + 0.5D, target.getY() + 0.0625D, target.getZ() + 0.5D)' in client
          assert 'aimAt(player, Vec3.atCenterOf(target))' not in client
          assert 'BlockHitResult' in client and 'dropObserved' in client and 'observer_uuid' in client
          assert 'p5DecorDiagnostic' in client and 'placement_aim_ticks=' in client and 'ATOMIC_MOVE' in client
          assert '@Mod.EventBusSubscriber(modid = CiTestProbe.MOD_ID, value = Dist.CLIENT' in client
          assert 'start_p5_decor_clients' in commands and 'verify_p5_decor_clients' in commands and 'cleanup_p5_decor_clients' in commands
          assert 'start_p5_decor_single' in commands and 'verify_p5_decor_single' in commands and 'cleanup_p5_decor_single' in commands
          assert '-Dblindbox.ci.p5DecorMarker=' in runner and '-Dblindbox.ci.p5DecorDiagnostic=' in runner and '-Dblindbox.ci.p5DecorStageDir=' in runner
          assert 'BLINDBOX_CITEST_P5_MARKER_DIR=' in script
          for marker in ('p5-decor-enabled.flag', 'p5-decor-place-${ROUND}.flag', 'p5-decor-break-${ROUND}.flag',
                         'BLINDBOX_CITEST_P5_DECOR_CLIENTS=success', 'BLINDBOX_CITEST_P5_DECOR_CLEANUP=success'):
              assert marker in script, marker
          start = script.index("printf 'blindboxcitest start_p5_decor_clients\\n' >&3")
          export = script.index("printf 'blindboxcitest export\\n' >&3")
          assert start < export
          handoff_prepare = script.index("printf 'blindboxcitest prepare_p4_text_handoff\\n' >&3")
          chicken_cleanup = script.index("printf 'blindboxcitest cleanup_p4_chicken\\n' >&3")
          handoff_release = script.index("printf 'blindboxcitest release_p4_text_handoff\\n' >&3")
          assert handoff_prepare < chicken_cleanup < start < export < handoff_release
          assert 'BLINDBOX_CITEST_P5_DECOR_SINGLE_STARTED=success' in single_script
          assert 'BLINDBOX_CITEST_P5_DECOR_SINGLE_CLIENT=success' in single_script
          assert 'BLINDBOX_CITEST_P5_DECOR_SINGLE_CLEANUP=success' in single_script
          assert 'client-1-p5-decor-single-observed.marker' in single_script
          assert 'GITHUB_ACTIONS' in single_script and 'one-real-forge-client' in single_runner
          assert '-Dblindbox.ci.p5DecorSingle=true' in single_runner
          assert '-Dblindbox.ci.p5DecorDiagnostic=' in single_runner
          assert 'scripts/ci/p5-single-decor.sh' in single_workflow
          assert 'continue-on-error' not in script and 'continue-on-error' not in runner
          PY
      - name: 生成 Jar 校验和
        run: |
          find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -print0 | sort -z | xargs -0 sha256sum > build/libs/SHA256SUMS
          cat build/libs/SHA256SUMS
      - name: 上传构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blindboxchallenge-jar
          path: |
            mod/build/libs/*.jar
            mod/build/libs/SHA256SUMS
          if-no-files-found: error
