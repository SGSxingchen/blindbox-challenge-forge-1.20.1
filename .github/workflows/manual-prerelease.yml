name: 手动构建并发布 1.0.5 候选版

on:
  workflow_dispatch:

# 仅本工作流显式手动运行；旧工作流保持停用，不合并开发源码到 master。
permissions:
  contents: read

concurrency:
  group: manual-prerelease-v1.0.5-rc.1
  cancel-in-progress: false

env:
  SOURCE_SHA: 4765e7c7f8d47835ced87a7f0bcb41e50f031444
  RELEASE_TAG: v1.0.5-rc.1
  GH_REPO: SGSxingchen/blindbox-challenge-forge-1.20.1

jobs:
  build-and-verify:
    if: github.repository == 'SGSxingchen/blindbox-challenge-forge-1.20.1' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: 检出固定候选源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: 核对源码与发布冲突
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" > "$RUNNER_TEMP/tags.json"
          jq -e --arg ref "refs/tags/$RELEASE_TAG" 'all(.[]; .ref != $ref)' "$RUNNER_TEMP/tags.json"
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name' > "$RUNNER_TEMP/releases.txt"
          if grep -Fxq "$RELEASE_TAG" "$RUNNER_TEMP/releases.txt"; then
            echo "::error::候选标签或发行已存在，禁止覆盖"
            exit 1
          fi
      - name: 安装 Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: 准备独立 Python 校验环境
        run: |
          python3 -m venv "$RUNNER_TEMP/release-venv"
          "$RUNNER_TEMP/release-venv/bin/pip" install Pillow==11.3.0
          echo "$RUNNER_TEMP/release-venv/bin" >> "$GITHUB_PATH"
      - name: 工具回归、三类生成器与资源契约
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/tests -v
          python3 tools/generate_original_textures.py --check
          python3 tools/generate_original_models.py --check
          python3 tools/generate_original_metadata.py --check
          python3 tools/verify_item_texture_redraw.py --validate-manifest
          python3 tools/verify_quality_contract.py
          git diff --exit-code
      - name: 完整构建与独立探针构建
        working-directory: mod
        run: |
          set -euo pipefail
          grep -Fq 'gradle-8.8-bin.zip' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          ./gradlew --no-daemon check build ciTestJar
      - name: 校验正式包依赖、映射与探针隔离
        run: |
          python3 - <<'PY'
          import glob, json, pathlib, zipfile
          formal = glob.glob('mod/build/libs/blindboxchallenge-*-all.jar')
          probe = glob.glob('mod/build/libs/blindboxchallenge-*-citest.jar')
          assert formal == ['mod/build/libs/blindboxchallenge-1.0.5-all.jar'], formal
          assert len(probe) == 1, probe
          with zipfile.ZipFile(formal[0]) as z:
              names = set(z.namelist())
              assert not any(n.startswith(('cn/blindboxchallenge/citest/', 'ci-audio/')) for n in names)
              assert any(n.startswith('META-INF/jarjar/') and 'jlayer' in n and n.endswith('.jar') for n in names)
              assert any(n.startswith('META-INF/jarjar/') and 'geckolib' in n and n.endswith('.jar') for n in names)
              for n in ('META-INF/licenses/JLayer-LGPL-2.1.txt', 'META-INF/licenses/JLayer-NOTICE.txt',
                        'blindboxchallenge.mixins.json', 'blindboxchallenge.refmap.json', 'META-INF/mods.toml'):
                  assert n in names, n
              assert json.loads(z.read('blindboxchallenge.refmap.json'))['mappings']
              assert '1.0.5' in z.read('META-INF/mods.toml').decode()
          with zipfile.ZipFile(probe[0]) as z:
              names = set(z.namelist())
              for n in ('cn/blindboxchallenge/citest/CiTestProbe.class', 'META-INF/mods.toml',
                        'ci-audio/blindbox-ci-tone.ogg', 'ci-audio/blindbox-ci-cache-pressure.ogg'):
                  assert n in names, n
          print('正式包依赖、运行映射、版本与独立探针隔离通过')
          PY
          mkdir -p release
          cp mod/build/libs/blindboxchallenge-1.0.5-all.jar release/
          (cd release && sha256sum blindboxchallenge-1.0.5-all.jar > blindboxchallenge-1.0.5-all.jar.sha256)
      - name: 同包纯专服启动、保存与停止
        working-directory: mod
        run: bash scripts/ci/server-smoke.sh
      - name: 同包独立探针强杀保存恢复
        working-directory: mod
        run: bash scripts/ci/lifecycle-recovery.sh
      - name: 确认验证后产物未变化
        run: |
          set -euo pipefail
          cmp release/blindboxchallenge-1.0.5-all.jar mod/build/libs/blindboxchallenge-1.0.5-all.jar
          (cd release && sha256sum -c blindboxchallenge-1.0.5-all.jar.sha256)
      - name: 保留本轮原始服务器证据
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manual-prerelease-server-evidence
          path: |
            mod/build/ci-forge-server/server.log
            mod/build/ci-lifecycle-evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: 仅传递验证后的正式包与校验和
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-prerelease-package
          path: release/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build-and-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 取回已验证正式包
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-prerelease-package
          path: release
      - name: 发布候选版本并重新下载核验
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 2
          sha256sum -c blindboxchallenge-1.0.5-all.jar.sha256
          gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" > "$RUNNER_TEMP/tags.json"
          jq -e --arg ref "refs/tags/$RELEASE_TAG" 'all(.[]; .ref != $ref)' "$RUNNER_TEMP/tags.json"
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name' > "$RUNNER_TEMP/releases.txt"
          if grep -Fxq "$RELEASE_TAG" "$RUNNER_TEMP/releases.txt"; then exit 1; fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## 1.0.5 候选版
          - 物品名称、效果与贴图修正，高清人物徽章和镐剑耐久调整。
          - 盲盒立体盒身、连续开盖动画与服务端开启时长配置。
          - 八音盒连接、读取、总下载时限及单文件大小限制；客户端登录报文串行调度修复。
          
          ## 安装
          Java 17、Minecraft 1.20.1、Forge 47.4.22。客户端与服务端同步更新，只安装 blindboxchallenge-1.0.5-all.jar；GeckoLib 4.8.4 与 JLayer 已内置。内部模组版本仍为 1.0.5，本次发行标签为预发布 v1.0.5-rc.1。
          
          ## 本轮 Actions 验证
          工具回归、三类资源生成器、资源与安全契约、Gradle check/build/ciTestJar、正式包与探针隔离、纯专服启动保存停止，以及独立探针 save-all flush 后强杀恢复均成功才允许发布。恢复夹具覆盖 PACK/OPEN SavedData、待处理死亡笔记、小黄鸡和门记录，不代表真实玩家完整验收。
          
          ## 尚未完成的验收
          本轮未运行图形客户端、真实多人、人工画面/听感、生存获取与非空奖池实际发奖验收。历史记录仅供参考，不替代新包验收，因此本版为预发布，不设为最新稳定版。
          
          ## 资源边界
          发行包含项目内重绘、用户授权模型及定义资源；参考照片和原始压缩素材不进入发行包。JLayer LGPL-2.1 与 NOTICE 随包保留。八音盒第三方 HTTPS 音频的可用性、版权与网络质量不作保证。
          NOTES
          printf '\n源码提交：%s\n\n本轮构建与证据：https://github.com/%s/actions/runs/%s\n\nSHA-256：\n\n' "$SOURCE_SHA" "$GH_REPO" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/release-notes.md"
          cat blindboxchallenge-1.0.5-all.jar.sha256 >> "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" blindboxchallenge-1.0.5-all.jar blindboxchallenge-1.0.5-all.jar.sha256 --repo "$GH_REPO" --target "$SOURCE_SHA" --title "盲盒挑战生存 1.0.5-rc.1" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease --latest=false
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$SOURCE_SHA"
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json isPrerelease,isDraft --jq 'select(.isPrerelease == true and .isDraft == false)' | grep -q .
          mkdir downloaded
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --dir downloaded
          (cd downloaded && sha256sum -c blindboxchallenge-1.0.5-all.jar.sha256)
          cmp blindboxchallenge-1.0.5-all.jar downloaded/blindboxchallenge-1.0.5-all.jar
          printf '已发布并下载核验：https://github.com/%s/releases/tag/%s\n' "$GH_REPO" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
