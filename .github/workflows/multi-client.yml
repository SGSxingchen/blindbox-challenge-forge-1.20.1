name: 真实双客户端联机

on:
  push:
  pull_request:
  # 若 GitHub 漏投递 push，可在同一 master SHA 手动真实执行，不能伪造门禁状态。
  workflow_dispatch:

jobs:
  p1-p4-multi-client-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装 Xvfb、Mesa 与固定启动库
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 libflite1
          python -m pip install 'minecraft-launcher-lib==8.0'
      - name: 构建正式模组与隔离测试探针
        run: |
          chmod +x gradlew scripts/ci/*.sh scripts/ci/*.py
          ./gradlew --no-daemon build ciTestJar
      - name: 启动 P1—P4 专服与两个真实 Forge 客户端
        run: scripts/ci/multi-client.sh
      - name: 上传 P1—P4 双客户端证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-client-evidence
          path: |
            mod/build/ci-multi-evidence/
            mod/build/ci-multi-server/server.log
            mod/build/ci-multi-server/crash-reports/
            mod/build/ci-client-1/logs/
            mod/build/ci-client-1/crash-reports/
            mod/build/ci-client-2/logs/
            mod/build/ci-client-2/crash-reports/
          if-no-files-found: warn

  p5-isolated-two-client:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装 Xvfb、Mesa 与固定启动库
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 libflite1
          python -m pip install 'minecraft-launcher-lib==8.0'
      - name: 构建正式模组与隔离测试探针
        run: |
          chmod +x gradlew scripts/ci/*.sh scripts/ci/*.py
          ./gradlew --no-daemon build ciTestJar
      - name: 启动独立 P5 专服世界与两个存活真实 Forge 客户端
        run: scripts/ci/p5-client-suite.sh dual
      - name: 上传 P5 独立双客户端证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-isolated-two-client-evidence
          path: |
            mod/build/ci-p5-dual-evidence/
            mod/build/ci-p5-dual-server/server.log
            mod/build/ci-p5-dual-server/crash-reports/
            mod/build/ci-p5-dual-client-1/logs/
            mod/build/ci-p5-dual-client-1/crash-reports/
            mod/build/ci-p5-dual-client-2/logs/
            mod/build/ci-p5-dual-client-2/crash-reports/
          if-no-files-found: warn
